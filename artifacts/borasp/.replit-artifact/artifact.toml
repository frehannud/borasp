kind = "web"
previewPath = "/"
title = "BoraSP"
description = "Aplicativo mobile-first de descoberta urbana em São Paulo que recomenda rapidamente um lugar para visitar a partir da estação de metrô e da vibe do usuário."
version = "1.0.0"
id = "artifacts/borasp"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20706

[services.development]
run = "pnpm --filter @workspace/borasp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/borasp", "run", "build" ]
serve = "static"
publicDir = "artifacts/borasp/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20706"
BASE_PATH = "/"
